version: '3.8'
services:
  db:
    image: mysql:8.0
    # 加上 platform 确保在 Apple Silicon (M1/M2/M3) 芯片上也能稳定运行
    platform: linux/amd64
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bazi_life
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: